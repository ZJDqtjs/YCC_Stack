# /etc/nginx/snippets/starstack.conf
#
# 把这个文件 include 进现有的 :80 server 块（sites-enabled/erp 里，紧跟
# `location / {` 之前），nginx 就多了一个子路径入口。用 ^~ 而不是普通前缀：
# erp 站点里有 `location ~* \.(?:js|css|html)$` 这类正则，正则的匹配优先级高于
# 前缀匹配，^~ 才能在 /starstack/ 下把它们挡住。
#
# proxy_pass 末尾的 / 会剥掉 /starstack 前缀，所以 Broker 自己看到的仍是
# /api/...：Broker 不需要知道公网路径，但 Cookie 需要（--cookie-path /starstack/），
# 否则浏览器会把它绑到 Set-Cookie 时那条请求的目录上，下一次请求就带不回来了。

location = /starstack {
    return 301 /starstack/;
}

location ^~ /starstack/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 原片上传：交给 Broker 自己按 --max-upload-mb 限，nginx 只做体积闸门。
    # 关掉请求缓冲，否则 nginx 会先把整个视频落到磁盘再转发，等于在 49G 的空闲
    # 空间里做两遍拷贝，而且第一个字节之前用户已经在等。
    client_max_body_size 600m;
    proxy_request_buffering off;

    # Provider Agent 用 20 秒长轮询领活，分片回传可能更大；默认的 60s 读超时会
    # 让 Agent 每隔一分钟被踢断一次。
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}
